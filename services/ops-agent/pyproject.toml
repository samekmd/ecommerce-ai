[project]
name = "ops-agent"
version = "0.1.0"
description = "Agente de cadastro do e-commerce: frase -> proposta estruturada -> confirmacao humana"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-ai-slim[openai,groq]>=2.51.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "langfuse>=4.15.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
